name: SQL Build Check

on:
  pull_request:
    paths:
      - 'fabric/**'
      - 'source_dwh/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  sql-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List Fabric SQL artifacts
        run: |
          echo "Fabric Warehouse item files (legacy per-object layout):" | tee -a "$GITHUB_STEP_SUMMARY"
          find fabric -path 'fabric/*.Warehouse/Schemas/*' -name '*.sql' -type f 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "Fabric Warehouse project files (sqlproj layout, Fabric auto-pushed):" | tee -a "$GITHUB_STEP_SUMMARY"
          find fabric -path 'fabric/*.Warehouse/*' \( -name '*.sqlproj' -o -name 'xmla.json' \) -type f 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "Fabric root SQL files (seed/validate, demo path):" | tee -a "$GITHUB_STEP_SUMMARY"
          find fabric -maxdepth 1 -name '*.sql' -type f 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "Post-deployment files:" | tee -a "$GITHUB_STEP_SUMMARY"
          find fabric/post-deployment -name '*.sql' -type f 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Fail when no Fabric Warehouse artifact is present
        run: |
          # Accept either layout:
          #   (a) legacy per-object: fabric/*.Warehouse/Schemas/dbo/{Tables,Views}/*.sql
          #   (b) sqlproj (Fabric auto-pushed): fabric/*.Warehouse/*.sqlproj
          legacy=$(find fabric -path 'fabric/*.Warehouse/Schemas/*' -name '*.sql' -type f -print -quit)
          sqlproj=$(find fabric -path 'fabric/*.Warehouse/*' -name '*.sqlproj' -type f -print -quit)
          if [ -z "$legacy" ] && [ -z "$sqlproj" ]; then
            echo "::error::No Fabric Warehouse artifact found (neither Schemas/*.sql nor *.sqlproj). Warehouse item is missing." >&2
            exit 1
          fi

      - name: Detect dangerous DDL in Warehouse item and source
        run: |
          # Scan the Warehouse item and source DWH only.
          # fabric/post-deployment/security.sql and scripts/reset_demo.sh are allowed to
          # contain TRUNCATE/DROP because they are applied manually outside Git sync.
          # SQL line comments (--) are excluded so that mapping notes don't false-positive.
          hits=$(grep -RnE "DROP\s+DATABASE|DROP\s+SCHEMA|TRUNCATE\s+TABLE|DROP\s+TABLE" \
                   fabric/*.Warehouse source_dwh tests 2>/dev/null \
                 | grep -vE ':[0-9]+:[[:space:]]*--' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Dangerous DDL detected. Remove or justify in PR description." >&2
            exit 1
          fi

      - name: Detect unsupported Netezza-only syntax in Fabric target
        run: |
          # Fabric Warehouse T-SQL does not support DISTRIBUTE ON or ORGANIZE ON.
          # Source files under source_dwh/ are exempt; Fabric targets must be clean.
          # SQL line comments (--) are excluded so that mapping notes don't false-positive.
          hits=$(grep -RnE "DISTRIBUTE\s+ON|ORGANIZE\s+ON" fabric/*.Warehouse 2>/dev/null \
                 | grep -vE ':[0-9]+:[[:space:]]*--' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Netezza-only clause leaked into Fabric Warehouse target." >&2
            exit 1
          fi

      - name: Basic T-SQL hygiene check
        run: |
          # Every Fabric Warehouse object SQL should contain CREATE TABLE / CREATE VIEW / CREATE PROCEDURE / CREATE FUNCTION.
          # (Security objects live in fabric/post-deployment/ and are scanned separately.)
          set -e
          missing=0
          while IFS= read -r f; do
            if ! grep -qiE "CREATE\s+(TABLE|VIEW|PROCEDURE|FUNCTION)" "$f"; then
              echo "::warning file=$f::No CREATE statement found"
              missing=$((missing + 1))
            fi
          done < <(find fabric -path 'fabric/*.Warehouse/Schemas/*' -name '*.sql' -type f)
          echo "Files without a CREATE statement: $missing" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate inventory CSV header
        run: |
          expected="object_name,object_type,source_schema,target_schema,estimated_rows,refresh_pattern,complexity,business_priority"
          actual=$(head -n1 inventory/dwh_objects.csv | tr -d '\r')
          if [ "$expected" != "$actual" ]; then
            echo "::error::inventory/dwh_objects.csv header drifted. Expected: $expected" >&2
            exit 1
          fi
